# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: ตั้งค่าให้ SonarScanner รู้ว่าจะวิเคราะห์โค้ดส่วนไหนของ Nestly บ้าง
# การทำงาน: scanner อ่านไฟล์นี้จาก root ของโปรเจกต์ตอนสั่ง scan แล้วส่งผลขึ้น SonarQube server

sonar.projectKey=nestly
sonar.projectName=Nestly
sonar.sources=.

# โฟลเดอร์ที่ไม่ใช่โค้ดที่เราเขียนเอง หรือเป็นผลลัพธ์ที่ถูกสร้างขึ้นมา
# generated/ คือ Prisma Client ที่ prisma generate สร้างให้ ไม่ใช่โค้ดที่คนแก้
# prisma/migrations/ เป็น SQL ที่ Prisma สร้าง ไม่ควรนับเป็นหนี้ทางเทคนิคของเรา
sonar.exclusions=node_modules/**,.next/**,.next-*/**,generated/**,coverage/**,coverage-integration/**,playwright-report/**,test-results/**,storage/**,public/**,docs/**,prisma/migrations/**,**/*.md,**/.DS_Store

# บอก SonarQube ว่าไฟล์ไหนคือเทสต์ เพื่อแยกออกจากโค้ดโปรดักชันตอนคิดคะแนน
# unit test ของโปรเจกต์นี้วางไว้ข้าง ๆ ไฟล์ต้นทางใน lib/ ส่วน integration/e2e อยู่ใน tests/
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**

# ผลความครอบคลุมของเทสต์ SonarQube รวมรายงานหลายไฟล์ให้เอง
# coverage/ มาจาก `npm run test:coverage` (ชุด unit ของ lib/)
# coverage-integration/ มาจาก `npm run test:coverage:integration` (ชุดที่เรียก route handler
# ใน app/api จริงผ่านฐานข้อมูลทดสอบ) ถ้าไม่ใส่ไฟล์นี้ app/api จะถูกนับเป็น 0%
# ทั้งที่มีเทสต์ครอบอยู่แล้ว
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info

# สคริปต์ใน scripts/ เป็นเครื่องมือ CLI ที่คนรันเองตอนพัฒนา (สร้างรายงาน, ตรวจ OpenAPI,
# ตั้งค่าผู้ดูแลระบบครั้งแรก) ไม่ใช่โค้ดที่ผู้ใช้เรียกผ่านเว็บ จึงไม่บังคับ coverage
# แต่ยังวิเคราะห์หาบั๊กและ code smell ตามปกติ
# components/** ทดสอบด้วย Playwright ไม่ใช่ vitest ตามที่ AGENTS.md วางไว้
# (logic ไม่อยู่ในคอมโพเนนต์ ส่วน JSX นั้น vitest ครอบไม่ได้ถ้าไม่ลง jsdom เพิ่ม)
# จึงไม่บังคับ coverage แต่ยังวิเคราะห์หาบั๊กและ code smell ตามปกติ
# ย้ำว่าไม่รวม app/** เพราะนั่นคือ route handler ฝั่งเซิร์ฟเวอร์ ไม่ใช่ UI
# และมีชุด integration ครอบอยู่จริง
sonar.coverage.exclusions=scripts/**,components/**

# ปิดการอ่านประวัติ git (blame) เพราะ JGit ที่ SonarQube ใช้ อ่าน pack format
# ของ git รุ่นใหม่ในเครื่องนี้ไม่ได้ (ขึ้น MissingObjectException ทั้งที่ git เองอ่านได้)
# ข้อมูลนี้ใช้แค่ระบุผู้เขียนโค้ดรายบรรทัด ไม่กระทบการหา bug/ช่องโหว่
sonar.scm.disabled=true

# หน่วยความจำของ Node bridge ที่ scanner ใช้วิเคราะห์ JS/TS
# โปรเจกต์นี้มีราว 350 ไฟล์ 2048MB จึงเหลือเฟือ และเผื่อที่ให้ JVM ของ scanner
# ในคอนเทนเนอร์ด้วย ถ้าตั้งสูงเกินที่ Docker VM มีจริง Node bridge จะถูก OOM kill
# แล้วขึ้น error ว่า "bridge server is unresponsive"
sonar.javascript.node.maxspace=2048
