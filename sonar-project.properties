# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: ตั้งค่าให้ SonarScanner รู้ว่าจะวิเคราะห์โค้ดส่วนไหนของ Nestly บ้าง
# การทำงาน: scanner อ่านไฟล์นี้จาก root ของโปรเจกต์ตอนสั่ง scan แล้วส่งผลขึ้น SonarQube server

sonar.projectKey=nestly
sonar.projectName=Nestly
sonar.sources=.

# โฟลเดอร์ที่ไม่ใช่โค้ดที่เราเขียนเอง หรือเป็นผลลัพธ์ที่ถูกสร้างขึ้นมา
# generated/ คือ Prisma Client ที่ prisma generate สร้างให้ ไม่ใช่โค้ดที่คนแก้
# prisma/migrations/ เป็น SQL ที่ Prisma สร้าง ไม่ควรนับเป็นหนี้ทางเทคนิคของเรา
# deliverables/ คือเอกสารส่งงานกับสคริปต์ที่ใช้ถ่ายภาพหน้าจอทำคู่มือ ไม่ใช่โค้ดของระบบ
# .claude/ คือไฟล์ตั้งค่าของเครื่องมือช่วยเขียนโค้ด
# .env กับ .env.*.local คือค่าลับจริงของแต่ละเครื่อง (gitignore ไว้แล้ว) scanner อ่านจากโฟลเดอร์จริง
# ไม่ใช่จาก git จึงต้องตัดออกเอง ไม่งั้นรหัสผ่านจริงจะถูกส่งขึ้นเซิร์ฟเวอร์ SonarQube ไปด้วย
# ส่วน .env.example ยังสแกนตามปกติ เพราะต้องไม่มีค่าลับจริงอยู่แล้ว
sonar.exclusions=node_modules/**,.next/**,.next-*/**,generated/**,coverage/**,coverage-integration/**,playwright-report/**,test-results/**,storage/**,public/**,docs/**,prisma/migrations/**,deliverables/**,.claude/**,.env,.env.local,.env.*.local,**/*.md,**/.DS_Store

# บอก SonarQube ว่าไฟล์ไหนคือเทสต์ เพื่อแยกออกจากโค้ดโปรดักชันตอนคิดคะแนน
# unit test ของโปรเจกต์นี้วางไว้ข้าง ๆ ไฟล์ต้นทางใน lib/ ส่วน integration/e2e อยู่ใน tests/
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**

# ผลความครอบคลุมของเทสต์ SonarQube รวมรายงานหลายไฟล์ให้เอง
# coverage/ มาจาก `npm run test:coverage` (ชุด unit ของ lib/)
# coverage-integration/ มาจาก `npm run test:coverage:integration` (ชุดที่เรียก route handler
# ใน app/api จริงผ่านฐานข้อมูลทดสอบ) ถ้าไม่ใส่ไฟล์นี้ app/api จะถูกนับเป็น 0%
# ทั้งที่มีเทสต์ครอบอยู่แล้ว
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info

# สคริปต์ใน scripts/ เป็นเครื่องมือ CLI ที่คนรันเองตอนพัฒนา (สร้างรายงาน, ตรวจ OpenAPI,
# ตั้งค่าผู้ดูแลระบบครั้งแรก) ไม่ใช่โค้ดที่ผู้ใช้เรียกผ่านเว็บ จึงไม่บังคับ coverage
# แต่ยังวิเคราะห์หาบั๊กและ code smell ตามปกติ
# components/** ทดสอบด้วย Playwright ไม่ใช่ vitest ตามที่ AGENTS.md วางไว้
# (logic ไม่อยู่ในคอมโพเนนต์ ส่วน JSX นั้น vitest ครอบไม่ได้ถ้าไม่ลง jsdom เพิ่ม)
# จึงไม่บังคับ coverage แต่ยังวิเคราะห์หาบั๊กและ code smell ตามปกติ
# app/**/*.tsx (page, layout, loading, error) เป็น Server/Client Component ที่แค่ประกอบหน้าจอ
# จากข้อมูลที่ lib/ เตรียมไว้ ทดสอบด้วย Playwright เหมือน components/ จึงไม่บังคับ coverage เช่นกัน
# lib/client/use-*.ts กับ lib/client/documents.ts เป็น React hook และโค้ดที่ต้องมี DOM ของเบราว์เซอร์
# ไฟล์ *.config.* เป็นการตั้งค่าเครื่องมือ ไม่มี logic ของระบบ
# sonar-reports/ เป็นสคริปต์สร้างรายงาน PDF ที่คนรันเองเหมือน scripts/
# route handler ใน app/api/**/route.ts ยังถูกบังคับ coverage เพราะเป็นโค้ดฝั่งเซิร์ฟเวอร์
# และมีชุด integration ครอบอยู่จริง
sonar.coverage.exclusions=scripts/**,components/**,app/**/*.tsx,lib/client/use-*.ts,lib/client/documents.ts,**/*.config.*,sonar-reports/**

# ปิดกฎ "hard-coded password" (S2068) เฉพาะ lib/ui-labels.ts ไฟล์เดียว
# ไฟล์นี้มีแค่ตารางแปลงชื่อเหตุการณ์ audit เป็นคำไทย เช่น PASSWORD_RESET_REQUEST: "ขอตั้งรหัสผ่านใหม่"
# SonarQube เห็นคำว่า PASSWORD ในชื่อ key แล้วเดาว่าค่าเป็นรหัสผ่าน ซึ่งไม่ใช่ (ดู docs/SONARQUBE_TH.md)
# เขียนไว้ที่นี่แทนการกด false positive บนเว็บ เพื่อให้ทุกเครื่องที่สแกนได้ผลเหมือนกัน
# ไฟล์อื่นยังถูกตรวจด้วยกฎนี้ตามปกติ
sonar.issue.ignore.multicriteria=uiLabelsPassword,richTextEditorRole,ownerWorkspaceContext
sonar.issue.ignore.multicriteria.uiLabelsPassword.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.uiLabelsPassword.resourceKey=lib/ui-labels.ts

# กฎ "ใช้แท็ก HTML แทน role" (S6819) แนะนำ <textarea> แทน role="textbox"
# แต่ตัวแก้ไขแม่แบบเอกสารเป็น rich text (ตัวหนา ตาราง รูป) ที่ <textarea> ทำไม่ได้
# WAI-ARIA แนะนำให้ตัวแก้ไขแบบ contentEditable ใส่ role="textbox" ไว้ให้โปรแกรมอ่านหน้าจอรู้ว่าพิมพ์ได้
# จึงยกเว้นเฉพาะไฟล์นี้ ไฟล์อื่นยังตรวจกฎนี้ตามปกติ
sonar.issue.ignore.multicriteria.richTextEditorRole.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.richTextEditorRole.resourceKey=components/dorm/DocumentTemplatePanel.tsx

# กฎ "ค่า context ต้อง useMemo" (S6481) ยกเว้นเฉพาะ DormDashboard
# ค่า context ของหน้านี้รวม state เกือบทั้งหน้า จึงเปลี่ยนแทบทุกครั้งที่หน้า render อยู่แล้ว useMemo แทบไม่ได้ประโยชน์
# และค่า accessState มาจากการเรียกฟังก์ชัน ทำให้ lint ของ React Compiler (preserve-manual-memoization)
# ฟ้องเป็น error ทันทีที่ครอบ useMemo การแก้ให้ถูกต้องต้องแยก state ของหน้าออกเป็นหลาย context ซึ่งเป็นงานใหญ่แยกต่างหาก
# ส่วน TenantPortal ครอบ useMemo แล้วตามกฎนี้
sonar.issue.ignore.multicriteria.ownerWorkspaceContext.ruleKey=typescript:S6481
sonar.issue.ignore.multicriteria.ownerWorkspaceContext.resourceKey=components/dorm/DormDashboard.tsx

# ปิดการอ่านประวัติ git (blame) เพราะ JGit ที่ SonarQube ใช้ อ่าน pack format
# ของ git รุ่นใหม่ในเครื่องนี้ไม่ได้ (ขึ้น MissingObjectException ทั้งที่ git เองอ่านได้)
# ข้อมูลนี้ใช้แค่ระบุผู้เขียนโค้ดรายบรรทัด ไม่กระทบการหา bug/ช่องโหว่
sonar.scm.disabled=true

# หน่วยความจำของ Node bridge ที่ scanner ใช้วิเคราะห์ JS/TS
# โปรเจกต์นี้มีราว 350 ไฟล์ 2048MB จึงเหลือเฟือ และเผื่อที่ให้ JVM ของ scanner
# ในคอนเทนเนอร์ด้วย ถ้าตั้งสูงเกินที่ Docker VM มีจริง Node bridge จะถูก OOM kill
# แล้วขึ้น error ว่า "bridge server is unresponsive"
sonar.javascript.node.maxspace=2048
