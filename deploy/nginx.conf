# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: config ของ nginx บน VPS รับคำขอของโดเมน nestlyspace.tech แล้วส่งต่อให้ container ของแอป
# การทำงาน: แอปเปิดอยู่ที่ 127.0.0.1:3000 (คนนอกเข้าตรงไม่ได้) nginx รับที่ port 80
#           จากนั้น certbot --nginx จะเพิ่มส่วน HTTPS (443) และ redirect จาก http ให้เอง
# ติดตั้ง: sudo cp nginx.conf /etc/nginx/sites-available/nestly
#          sudo ln -s /etc/nginx/sites-available/nestly /etc/nginx/sites-enabled/nestly
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name nestlyspace.tech www.nestlyspace.tech;

    # แอปรับไฟล์ได้ไม่เกิน 5 MB ต่อไฟล์ ค่า default ของ nginx คือ 1 MB จะตัดคำขอทิ้งก่อนถึงแอป
    # เผื่อส่วนหัวของ multipart ไว้ จึงตั้ง 10 MB
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # สร้าง PDF สัญญาและใบแจ้งหนี้ด้วย Chromium อาจใช้เวลาหลายวินาที
        proxy_read_timeout 120s;
    }
}
