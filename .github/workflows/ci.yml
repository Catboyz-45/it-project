# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: เป็นไฟล์ตั้งค่าสภาพแวดล้อม “ci” สำหรับ container หรือระบบอัตโนมัติ
# การทำงาน: ระบุบริการ ขั้นตอน build และค่าที่เชื่อมกัน โดยรับความลับจาก environment แทนการเขียนไว้ในไฟล์

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (block high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (block high and critical)
        run: npm audit --audit-level=high

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run openapi:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dorm_test
          POSTGRES_USER: dorm_test
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dorm_test -d dorm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dorm_test:integration-only@127.0.0.1:5432/dorm_test?schema=public
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: ./storage/test-documents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dorm_e2e_test
          POSTGRES_USER: dorm_test
          POSTGRES_PASSWORD: e2e-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dorm_test -d dorm_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://dorm_test:e2e-only@127.0.0.1:5432/dorm_e2e_test?schema=public
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: ./storage/e2e-documents
      BOOTSTRAP_ADMIN_EMAIL: e2e-super-admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: e2e-password-strong-123
      BOOTSTRAP_ADMIN_NAME: E2E Super Admin
      SHOW_DEMO_CREDENTIALS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run admin:bootstrap
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: nestly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime image uses a non-root user
        run: test "$(docker image inspect nestly:ci --format '{{.Config.User}}')" = "nextjs"
      - name: Validate Docker Compose configuration
        env:
          JOB_SECRET: ci-maintenance-secret-at-least-32-characters
          POSTGRES_PASSWORD: ci-database-password
        run: docker compose config --quiet
      - name: Smoke test migrations and application health
        env:
          JOB_SECRET: ci-maintenance-secret-at-least-32-characters
          POSTGRES_PASSWORD: ci-database-password
        run: |
          docker compose up -d postgres
          docker compose run --rm migrate
          docker compose up -d app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Stop Docker Compose services
        if: always()
        env:
          JOB_SECRET: ci-maintenance-secret-at-least-32-characters
          POSTGRES_PASSWORD: ci-database-password
        run: docker compose down --volumes --remove-orphans
