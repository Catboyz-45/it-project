# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: ค่าที่ใช้เฉพาะตอนพัฒนาในเครื่อง docker compose โหลดไฟล์นี้ต่อจาก docker-compose.yml ให้เอง
# การทำงาน: เปิด port ฐานข้อมูลที่ 127.0.0.1 ให้เครื่องมืออย่าง Prisma Studio ต่อได้ บน VPS ไม่ได้ copy ไฟล์นี้ไป port จึงไม่ถูกเปิด

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
