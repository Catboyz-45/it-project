# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: ตั้งค่า SonarQube (เครื่องมือวิเคราะห์คุณภาพ/ความปลอดภัยของโค้ด) สำหรับใช้ในเครื่องนักพัฒนา
# การทำงาน: แยกไฟล์ออกจาก docker-compose.yml ของแอปโดยตั้งใจ เพราะเป็นเครื่องมือตอนพัฒนา
# ไม่ใช่ส่วนหนึ่งของระบบที่ต้อง deploy ขึ้น production
#
# วิธีใช้: npm run sonar:up   (เปิดที่ http://localhost:9000 ล็อกอินครั้งแรก admin/admin)

services:
  sonarqube:
    image: sonarqube:community
    container_name: nestly_sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  # ฐานข้อมูลของ SonarQube เอง ไม่เกี่ยวกับฐานข้อมูลของแอป
  # ไม่เปิด port ออกนอกเครื่อง เพราะมีแค่ SonarQube ที่ต้องใช้
  sonarqube-db:
    image: postgres:17-alpine
    container_name: nestly_sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgres:
