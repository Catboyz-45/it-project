# คำอธิบายสำหรับผู้เริ่มต้น
# ภาพรวมไฟล์: เป็นไฟล์ตั้งค่าสภาพแวดล้อม “docker compose” สำหรับ container หรือระบบอัตโนมัติ
# การทำงาน: ระบุบริการ ขั้นตอน build และค่าที่เชื่อมกัน โดยรับความลับจาก environment แทนการเขียนไว้ในไฟล์

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Force UTC regardless of the host's timezone. Session.expiresAt and other
    # DateTime columns are stored as "timestamp without time zone"; if the
    # server's session timezone isn't UTC, Prisma reads those values back
    # shifted by the server's offset relative to the app's UTC-based Date math.
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      TZ: UTC
      POSTGRES_DB: dorm
      POSTGRES_USER: dorm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # ไม่เปิด port ของฐานข้อมูลออกนอก container ตอน dev ที่ต้องต่อจากเครื่อง ดู docker-compose.override.yml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm_app -d dorm"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    # บน VPS ดึง image ที่ GitHub Actions build ไว้แล้วจาก GHCR ในเครื่องใช้ชื่อ local ที่ build เอง
    image: ${MIGRATOR_IMAGE:-nestly-migrator:local}
    environment:
      DATABASE_URL: postgresql://dorm_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/dorm?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE:-nestly-app:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dorm_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/dorm?schema=public
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/storage/documents
      JOB_SECRET: ${JOB_SECRET:?Set JOB_SECRET to at least 32 random characters}
      SHOW_DEMO_CREDENTIALS: "false"
      # ใช้ประกอบลิงก์ในอีเมลรีเซ็ตรหัสผ่าน ถ้าไม่ตั้งค่า Resend ครบ ฟีเจอร์นี้จะตอบ 503 ตามที่ตั้งใจไว้
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_EMAIL_FROM: ${PASSWORD_RESET_EMAIL_FROM:-}
    # bind ที่ 127.0.0.1 เสมอ ให้คนนอกเข้าได้ผ่าน nginx เท่านั้น
    ports:
      - "${APP_PORT:-127.0.0.1:3000}:3000"
    volumes:
      - app_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  maintenance:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE:-nestly-app:local}
    restart: unless-stopped
    command: ["node", "scripts/maintenance-worker.mjs"]
    # image เดียวกับแอปมี HEALTHCHECK ที่เรียก port 3000 แต่ container นี้ไม่ได้เปิดเว็บ
    # ถ้าไม่ปิดจะขึ้นสถานะ unhealthy ตลอดทั้งที่ทำงานปกติ
    healthcheck:
      disable: true
    environment:
      JOB_ENDPOINT: http://app:3000/api/internal/jobs/maintenance
      JOB_SECRET: ${JOB_SECRET:?Set JOB_SECRET to at least 32 random characters}
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-300}
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
